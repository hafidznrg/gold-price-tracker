# SOURCE + MACRO_SERIES (DATA-MODEL §3.5). Ditulis manusia lewat PR; state bot ada di data/meta/status.json.
#
# P1-04 mengaktifkan ubslifestyle lebih dulu; sumber lain menyusul setelah scraper-nya selesai.
# `probe` dan run manual yang menyebut sumber secara eksplisit tetap bisa menjalankan sumber nonaktif.
# `parser_version` = versi modul parser (`parserVersion` di apps/scraper/src/sources/*).
#
# `update_calendar` sementara; nilai final ditetapkan dari observasi Fase 0–1 (Q-6).
#   daily            — diharapkan ada data setiap hari
#   weekdays         — Senin–Jumat
#   business_days_id — Senin–Jumat dikurangi config/holidays.yml
#   monthly          — sekali per bulan (World Bank Pink Sheet)

sources:
  - id: ubslifestyle
    kind: prices
    url: https://ubslifestyle.com/harga-buyback-hari-ini/
    fetch_method: http
    workflow: scrape-retail
    update_calendar: business_days_id # P0-07: histori menunjukkan Senin–Sabtu; final di P1-11 (Q-6)
    stale_is_error_on_expected_day: true
    parser_version: 1.0.0
    enabled: true
    notes: Tanggal data dari endpoint grafik admin-ajax, bukan blok "Updated" (D-19).

  - id: pegadaian
    kind: prices
    url: https://pegadaian.co.id/gold/prices/table
    fetch_method: api
    workflow: scrape-retail
    update_calendar: daily # P0-08: harga batangan tidak diperbarui Minggu; final di P1-11 (Q-6)
    stale_is_error_on_expected_day: true
    parser_version: 0.1.0
    enabled: false
    notes: JSON tanpa token; brand dari idVendor (D-20); fallback Playwright membaca DOM /harga-emas.

  - id: logammulia
    kind: prices
    url: https://www.logammulia.com/id
    fetch_method: browser
    workflow: scrape-retail
    update_calendar: daily
    parser_version: 0.1.0
    enabled: false
    notes: Sesi Playwright + stealth + token CSRF; bila gagal dibiarkan kosong (D-06).

  - id: xaus
    kind: macro
    url: https://xaus.com/api/v1/history
    fetch_method: api
    workflow: scrape-macro
    update_calendar: weekdays
    parser_version: 0.1.0
    enabled: false
    notes: Indikatif — histori dari futures GC=F (Yahoo), spot dari gold-api.com; bukan LBMA (D-21).

  - id: jisdor
    kind: macro
    url: https://www.bi.go.id/id/statistik/informasi-kurs/jisdor/default.aspx
    fetch_method: http
    workflow: scrape-macro
    update_calendar: business_days_id
    parser_version: 0.1.0
    enabled: false
    notes: GET halaman = 10 hari kerja terakhir; backfill lewat postback ButtonExport → XLSX (D-21).

  - id: worldbank
    kind: macro
    url: https://www.worldbank.org/en/research/commodity-markets
    fetch_method: file
    workflow: scrape-macro
    update_calendar: monthly
    parser_version: 0.1.0
    enabled: false
    notes: Halaman menautkan CMO-Historical-Data-Monthly.xlsx; hash URL berubah tiap rilis (D-21).

macro_series:
  - { id: xau_usd_oz, concept: gold_usd, unit: USD/ozt, source: xaus, precedence: 1 }
  - { id: usd_idr_jisdor, concept: usd_idr, unit: IDR/USD, source: bi, precedence: 1 }
  - { id: usd_idr_ecb, concept: usd_idr, unit: IDR/USD, source: ecb, precedence: 2 }
  - { id: usd_idr_annual, concept: usd_idr, unit: IDR/USD, source: wdi, precedence: 3 }
