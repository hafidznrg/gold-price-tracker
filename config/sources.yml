# SOURCE + MACRO_SERIES (DATA-MODEL §3.5). Ditulis manusia lewat PR; state bot ada di data/meta/status.json.
#
# Aktif: lotusarchi (P6-09), ubslifestyle (P1-04), pegadaian (P1-07), logammulia (P1-06, D-26), xaus (P2-03),
# jisdor (P2-04), worldbank (P2-05, hanya dipilih `plan` bila rata-rata bulan lalu belum ada).
# `probe` dan run manual yang menyebut sumber secara eksplisit tetap bisa menjalankan sumber nonaktif.
# `parser_version` = versi modul parser (`parserVersion` di apps/scraper/src/sources/*).
#
# `update_calendar` sementara; nilai final ditetapkan dari observasi Fase 0–1 (Q-6).
#   daily            — diharapkan ada data setiap hari
#   weekdays         — Senin–Jumat
#   business_days_id — Senin–Jumat dikurangi config/holidays.yml
#   mon_sat_id       — Senin–Sabtu dikurangi config/holidays.yml (D-63)
#   monthly          — sekali per bulan (World Bank Pink Sheet)
#
# `schedule_window` (default `day`): pasangan cron primary + retry tempat sumber dijalankan.
#   day     — scrape-retail Cloudflare 09.05 (primary) & 12.05 WIB (retry); cadangan GitHub 04.15 &
#             09.15 WIB (retry, tiba ±5–10 jam kemudian); dilewati sebelum 08.30 WIB (D-46)
#   afternoon — scrape-retail Cloudflare 15.05 (primary) & 17.05 WIB (retry); cadangan GitHub 09.15 WIB
#             (retry, tiba ±14–19 WIB); dilewati sebelum 12.00 WIB; watchdog 18.05 WIB (D-63)
#   evening — scrape-retail Cloudflare 19.05 (primary) & 22.05 WIB (retry); cadangan GitHub 19.15 WIB
#   any     — semua slot di atas (D-42)
# `accept_previous_day` (default false): V-06 menerima tanggal data sasaran − 1 s/d tanggal WIB run (D-42).
# (scrape-macro: Cloudflare 16.40 WIB primary + cadangan GitHub 16.45 WIB retry, hari kerja; semua `day`, D-46.)

sources:
  - id: ubslifestyle
    kind: prices
    url: https://ubslifestyle.com/harga-buyback-hari-ini/
    fetch_method: http
    workflow: scrape-retail
    update_calendar: mon_sat_id # terbit Senin–Sabtu, tidak Minggu (31 Okt, 7 & 14 Nov 2026; D-63)
    schedule_window: afternoon # terbit ±12.00–16.30 WIB; slot 09.05/12.05 terlalu pagi (D-63)
    stale_is_error_on_expected_day: true
    parser_version: 1.0.0
    enabled: true
    notes: Tanggal data dari endpoint grafik admin-ajax, bukan blok "Updated" (D-19).

  - id: pegadaian
    kind: prices
    url: https://pegadaian.co.id/gold/prices/table
    fetch_method: api
    workflow: scrape-retail
    update_calendar: daily # P1-07: harga Minggu ada; final di P1-11 (Q-6)
    schedule_window: any # snapshot biasanya terbit ±18.17–21.27 WIB, sekali 00.05 WIB (D-25, D-42)
    stale_is_error_on_expected_day: true
    accept_previous_day: true # slot siang menambal snapshot kemarin (D-42)
    parser_version: 1.2.0
    enabled: true
    notes: JSON tanpa token; brand dari idVendor (D-20). Tabungan Emas dari /gold/prices (D-30). Fallback Playwright (DOM) belum dibuat (D-23).

  - id: galeri24
    kind: prices
    url: https://galeri24.co.id/api/gold-prices/page-data
    fetch_method: api
    workflow: scrape-retail
    update_calendar: daily # harga Minggu ada (15 & 16 Nov 2026); final setelah observasi (Q-6)
    schedule_window: afternoon # versi harga D terbit berulang: ±17.50 WIB D-1 (salinan harga D-1), lalu ±10.05–10.50 WIB hari D (harga sebenarnya); diambil dari API histori (versi updatedAt terbaru)
    stale_is_error_on_expected_day: true
    accept_previous_day: true # run terlambat lewat tengah malam tidak jadi alarm palsu (D-42)
    parser_version: 1.1.0
    enabled: true # P6-06, 17 Nov 2026
    notes: JSON server route Nuxt tanpa token; brand dari vendorCode (= idVendor Pegadaian, D-20). Fallback __NUXT_DATA__ dari /harga-emas.

  - id: lotusarchi
    kind: prices
    url: https://api.lotusarchi.com/harga-display
    fetch_method: api
    workflow: scrape-retail
    update_calendar: daily # sementara; final setelah observasi P6-01 (±21 Nov 2026)
    schedule_window: afternoon # jam terbit belum diketahui; 17 Nov pagi halaman masih 16 Nov, jadi dijadwalkan sore
    stale_is_error_on_expected_day: false # final setelah observasi P6-01 (±21 Nov 2026); sementara tanpa alarm palsu
    accept_previous_day: true # halaman bisa tertinggal sehari (D-42)
    parser_version: 1.0.0
    enabled: true # P6-09, 17 Nov 2026
    notes: Dua GET JSON yang mengisi /pricing/ (D-65), yaitu api.lotusarchi.com/harga-display (harga keping, tanpa tanggal) dan lotusarchi.com/wp-json/la/v1/harga-gold (harga dasar + buyback per gram per tanggal). Tabel HTML /pricing/ basi, tidak dipakai. Buyback hanya per gram → baris 1 g (D-26). Tanpa jam terbit.

  - id: logammulia
    kind: prices
    url: https://logammulia.com/harga-emas
    fetch_method: browser
    workflow: scrape-retail
    update_calendar: daily # 26 Okt 2026: harga diperbarui ±07.30–08.40 WIB, juga Minggu; final di P1-11 (Q-6)
    stale_is_error_on_expected_day: true
    parser_version: 1.0.0
    enabled: true
    notes: Playwright + stealth karena Akamai menolak browser otomatis biasa; API terenkripsi tidak dibongkar (D-26).

  - id: xaus
    kind: macro
    url: https://xaus.com/api/v1/history
    fetch_method: api
    workflow: scrape-macro
    update_calendar: weekdays
    parser_version: 1.0.0
    enabled: true
    notes: Indikatif — histori dari futures GC=F (Yahoo), spot dari gold-api.com; bukan LBMA (D-21).

  - id: jisdor
    kind: macro
    url: https://www.bi.go.id/id/statistik/informasi-kurs/jisdor/default.aspx
    fetch_method: http
    workflow: scrape-macro
    update_calendar: business_days_id
    parser_version: 1.0.0
    enabled: true
    notes: GET halaman = 10 hari kerja terakhir; backfill lewat postback ButtonExport → XLSX (D-21). Bila BI tidak dapat diakses, fallback Frankfurter ke usd_idr_ecb (TECH-SPEC §5.5).

  - id: worldbank
    kind: macro
    url: https://www.worldbank.org/en/research/commodity-markets
    fetch_method: file
    workflow: scrape-macro
    update_calendar: monthly
    parser_version: 1.0.0
    enabled: true
    notes: Halaman menautkan CMO-Historical-Data-Monthly.xlsx; hash URL berubah tiap rilis (D-21).

macro_series:
  - { id: xau_usd_oz, concept: gold_usd, unit: USD/ozt, source: xaus, precedence: 1 }
  - { id: usd_idr_jisdor, concept: usd_idr, unit: IDR/USD, source: bi, precedence: 1 }
  - { id: usd_idr_ecb, concept: usd_idr, unit: IDR/USD, source: ecb, precedence: 2 }
  - { id: usd_idr_annual, concept: usd_idr, unit: IDR/USD, source: wdi, precedence: 3 }
