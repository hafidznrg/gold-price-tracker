name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['data/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter scraper start check --root "$GITHUB_WORKSPACE"
      # Fase 3+: pnpm --filter web build, lalu job smoke Playwright terhadap hasil build
