name: watchdog
run-name: ${{ inputs.schedule && format('watchdog (cron {0})', inputs.schedule) || 'watchdog' }}

# D-44 — alarm "data hari ini belum masuk". Membaca data/meta/status.json dan mengirim Telegram
# bila sumber yang diharapkan hari itu belum punya data, misalnya karena pemicu atau scrape gagal. Tidak menulis data. Run gagal (merah) bila alarm tidak bisa dikirim.

on:
  schedule:
    # Cadangan saja (D-46): watchdog 13.05 & 23.05 WIB dipicu Cloudflare (apps/trigger). Cron ini
    # memberi tahu bila Worker mati total; terlambat ±7 jam, tiba esok pagi dan tetap memeriksa
    # tanggal cron-nya. Harus sama dengan GITHUB_WATCHDOG_SCHEDULES di pipeline/watchdog.ts.
    - cron: '15 16 * * *' # 23.15 WIB — semua sumber
  workflow_dispatch:
    inputs:
      schedule:
        description: Cron yang ditiru (diisi pemicu Cloudflare, D-45); kosong = periksa semua sumber hari ini
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: >
          pnpm --filter scraper start watchdog
          --event "${{ github.event_name }}"
          --schedule "${{ github.event.schedule }}"
          --emulate "$EMULATE"
          --actions-url "${{ github.server_url }}/${{ github.repository }}/actions"
          --root "$GITHUB_WORKSPACE"
        env:
          EMULATE: ${{ inputs.schedule }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
