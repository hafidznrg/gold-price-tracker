name: setup
description: Node + pnpm + dependensi
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4 # versi dari field "packageManager" di package.json
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
