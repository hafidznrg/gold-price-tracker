# D-45 — pemicu tepat waktu untuk workflow GitHub Actions. Deploy: lihat apps/trigger/README.md.
name = "gold-price-trigger"
main = "src/index.ts"
compatibility_date = "2025-10-01"
# Tanpa URL publik: Worker ini hanya punya handler `scheduled`.
workers_dev = false

[triggers]
# Harus sama dengan ROUTES di src/index.ts (UTC; WIB = UTC+7; D-67). Satu cron memuat semua jam;
# makro (jam 09 UTC) hanya dikirim Senin–Jumat oleh Worker. Maks. 5 per akun di paket Free.
crons = ["20 1,2,4,6,9,10,12,16 * * *"]

[vars]
GITHUB_REPO = "hafidznrg/gold-price-tracker"
GITHUB_REF = "main"

[observability]
enabled = true
